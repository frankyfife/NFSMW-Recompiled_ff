# ============================================================================
#  NFSMW Recomp - settings of the executable
#
#  The game reads this file at startup, from ITS OWN FOLDER:
#      <folder of the .exe>\nfsmw.toml
#
#  The name is the app's -"nfsmw"-, not the executable's, so it works next to
#  NFS_Most_Wanted.exe as well as next to nfsmw.exe.
#
#  Command-line arguments WIN over anything here. The launcher passes almost
#  every setting on the command line, so what you pick in the launcher is what
#  counts; this file matters when nfsmw.exe is started directly. The in-game
#  ESC menu saves its changes here.
# ============================================================================


# ----------------------------------------------------------------------------
#  EDRAM emulation path
# ----------------------------------------------------------------------------
#
#  WHAT IT IS
#  The Xbox 360 has no normal render targets: it has 10 MB of embedded memory
#  -the EDRAM- where fixed-function hardware does blending and the depth test.
#  There are two ways to emulate that:
#
#    "rtv"  host render targets, using the GPU the normal way. Fast.
#    "rov"  the EDRAM is emulated by hand inside the pixel shader, with
#           interlocks that force overlapping pixels to be processed IN ORDER.
#           More exact and MUCH slower.
#
#  WHY IT IS SET BY HAND
#  Because the SDK did not choose by performance but by GPU VENDOR
#  -src/graphics/d3d12/render_target_cache.cpp-:
#
#      path_ = vendor == kIntel ? kPixelShaderInterlock : kHostRenderTargets;
#
#  On Intel, ROV was forced. The reason is dated in the SDK's own comment: an
#  Intel driver bug from April 2021 -on a UHD 630- where the "always" stencil
#  comparison did not work. And the comment next to it says "The ROV path is
#  currently much slower generally".
#
#  MEASURED IN THIS PROJECT, on an Intel Iris 540, same spot, no vsync:
#      rov (what the SDK forced)    ~10 fps
#      rtv (this)                   ~18 fps
#
#  With no visible glitches, so the 2021 bug is gone from the driver.
#
#  On NVIDIA and AMD "rtv" already was the default, so setting it here changes
#  nothing for them. All this line does is remove a decision made by the brand
#  of the graphics card.
#
#  IF SOMETHING EVER LOOKS WRONG -ghosting, things that do not get cleared,
#  leftovers of the previous frame- try "rov" and compare.
render_target_path_d3d12 = "rtv"


# ----------------------------------------------------------------------------
#  Resolution (same as GoldenEye-Recomp, same ReXGlue SDK)
# ----------------------------------------------------------------------------
#
#  - video_mode_*: sets the GUEST VIDEO MODE (what the game presents), NOT the
#    window. The recomp's default was 854x480 (PAL EDTV) and the engine warns
#    "swap source is unscaled (854x480)" -> that is why it looked blurry even
#    with a high scale: the frame was stretched from 854x480.
#  - resolution_scale: the engine's own supersampling, as in GoldenEye:
#    render targets at N times both axes, scaled down to the window size.
#    Integers only (1/2/3/4). Applied AT STARTUP: restart the game to change
#    it. With a 1080p video mode:
#      2  = 3840x2160 internal  (4x the pixels)     <- recommended
#      3  = 5760x3240 internal  (9x the pixels)
#      4  = 7680x4320 internal  (16x the pixels)
#  - anisotropic_override: 0=off, 3=4x, 4=8x, 5=16x (applies without restart).
#  - swap_post_effect: "none" | "fxaa" | "fxaa_extreme" (the engine's post AA).
#  - user_profile_name: gamertag of the simulated Xbox Live profile (editable
#    in the ESC menu, GAME tab).
#
#  The launcher's arguments win over this: to try this file, start nfsmw.exe
#  directly (or from a .bat) without --resolution / --resolution_scale.
video_mode_width  = 1920
video_mode_height = 1080
resolution_scale  = 2
anisotropic_override = 5


# ----------------------------------------------------------------------------
#  Language: 1 = English, 3 = German, 4 = French, 5 = Spanish, 6 = Italian
#  Only languages on your disc work.
# ----------------------------------------------------------------------------
user_language = 3

# Black Edition content: byte 0x82A2CE06 (also switchable live in the ESC menu).
black_edition = true

# ----------------------------------------------------------------------------
#  GPU emulation speed (measured with the sampling profiler, tools/cpuprof)
# ----------------------------------------------------------------------------
#
#  - readback_resolve_max_kb: with readback_resolve = "fast" (set by the
#    launcher; without it the image comes out washed out) every render-to-
#    texture result was copied back to guest memory every frame: 3.6 GB/s
#    while driving, 16.6 % of the GPU command thread. The game reads only the
#    small ones on the CPU; the big ones are render targets the GPU samples.
#    0 = copy everything back (old behavior).
#  - clear_memory_page_state: true made every page uploaded by the CPU
#    invalid at the end of each frame, so the next frame copied it again
#    (~1 GB/s). With false a page is uploaded again only when the game writes
#    to it (write-protection catches that), as in Xenia Canary.
readback_resolve_max_kb = 64
clear_memory_page_state = false
